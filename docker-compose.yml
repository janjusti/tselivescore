services:
  tselivescore-prod:
    profiles: [prod]
    build: .
    container_name: tselivescore-prod
    environment: &app-env
      TZ: America/Sao_Paulo
      TSELIVESCORE_WAIT: 5
      TSELIVESCORE_SESSION_TTL: 30
      TSELIVESCORE_RATE_LIMIT: 120
      TSELIVESCORE_RATE_WINDOW: 60

  tselivescore:
    build: .
    container_name: tselivescore
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
    environment:
      <<: *app-env
      TSELIVESCORE_DEBUG: 1
      #TSELIVESCORE_MOCK: 1
